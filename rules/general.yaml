# ジェネラルルール（全会場・全条件共通）
# R1〜R14：古川尚史さんが実戦で蓄積したナレッジ

rules:
  - id: R1
    text: "コース距離と安定板は独立した変数として必ず個別に確認する。①1200m短縮のみ（時間短縮等）→インがやや有利になるが安定板効果なし ②安定板のみ（強風だが1800m）→イン有利・2-3着荒れの傾向あり ③1200m短縮＋安定板→最もイン有利かつ2-3着が最も荒れる（R1の最強発動条件） ④1800m・安定板なし→標準展開。いずれの場合も直前情報で実際の条件を確認してから戦略を決定する"
    tags: [course_length, stable_board, inner_advantage, scatter]

  - id: R2
    text: "1着固定する場合、2着・3着は機力＋展示STで4〜5艇まで広げる"
    tags: [box_bet, motor, exhibition_st]

  - id: R3
    text: "「展示ST上位」と「当地3連率上位」のクロス集合を必ず軸候補に"
    tags: [exhibition_st, local_3rate, axis_selection]

  - id: R4
    text: "「結論先行で条件を整合させていないか」を最後に必ず自問する"
    tags: [meta, self_check]

  - id: R5
    text: "期別コース別2連率と当地勝率の乖離をチェックし、乖離が大きければ期別を優先する"
    tags: [period_stats, local_winrate, course_stats]

  - id: R6
    text: "6コース選手は1着率と3着率の内訳を確認。3着型なら3着付け限定で使う"
    tags: [course6, place_type]

  - id: R7
    text: "市場本命（オッズ最低の組み合わせ）はトリガミ回避ライン死守 or 切る。中間なし"
    tags: [odds, trigami, favorite]

  - id: R8
    text: "自分で作ったルール（R1〜R14および会場別・条件別ルール）を毎回チェックする"
    tags: [meta, checklist]

  - id: R9
    text: "ボート2連率・3連率は単独で見ず、出走者中の相対順位を必ず確認する"
    tags: [boat, relative_ranking]

  - id: R10
    text: "3コース選手は「1着率主体か3着率主体か」をバー視認で必ず確認する"
    tags: [course3, place_type]

  - id: R11
    text: "モーター2連率0.00%は致命的サイン。1着評価は大幅減点する"
    tags: [motor, fatal_sign]

  - id: R12
    text: "過去成績が悪い選手でも、展示タイム・体重・チルトのいずれかが好材料なら3着付けで100円は残す"
    tags: [exhibition_time, weight, tilt, third_place]

  - id: R13
    text: "6艇編成をA級と切る選手だけで判断せず、展示で何かが光った選手を必ず1〜2人3着候補にいれる"
    tags: [class, exhibition, third_place]

  - id: R14
    text: "オッズ20倍超の中穴で「過去データ最悪・展示は好調」のパターンはハイリスクハイリターンの妙味枠として少額残す"
    tags: [middle_odds, high_risk, exhibition]

  - id: R15
    text: "予算を圧縮する際は「本線の厚張り分」から削る。R12・R13・R14で残した3着付け中穴の100〜200円ラインは原則削らない。中穴が削られた瞬間、妙味枠の機能が消滅する"
    tags: [budget, middle_odds, priority, R12, R13, R14]
    origin: "平和島12R（2026-05-04）での実戦学習"
