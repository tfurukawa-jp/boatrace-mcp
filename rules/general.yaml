# ジェネラルルール（全会場・全条件共通）
# 古川尚史さんが実戦で蓄積したナレッジ
#
# 【全体を貫く原則】
# 当節・当日の状態を、過去の実績より優先する。
# 節間成績・展示タイム・展示STは、全国勝率や当地連対率より新しい情報であり、
# 両者が食い違う場合は当節の状態を重く見る。
# R3・R11・R12・R13・R16 はいずれもこの原則の個別適用である。
#
# 番号は欠番を含む（R6・R9・R10・R14 は 2026-08-02 にアーカイブ）

rules:
  - id: R1
    text: "コース距離と安定板は独立した変数として必ず個別に確認する。①1200m短縮のみ（時間短縮等）→インがやや有利になるが安定板効果なし ②安定板のみ（強風だが1800m）→イン有利・2-3着荒れの傾向あり ③1200m短縮＋安定板→最もイン有利かつ2-3着が最も荒れる（R1の最強発動条件） ④1800m・安定板なし→標準展開。いずれの場合も直前情報で実際の条件を確認してから戦略を決定する。なお荒れ条件（②③）における2-3着の対処は一律に定めない。荒れ方は風向・風速・水面状態によって質が異なるため、会場別ルールと条件別ルールを参照して個別に判断する"
    tags: [course_length, stable_board, inner_advantage, scatter]

  - id: R2
    text: "1着を固定する場合、2着は有力2〜3艇に絞り、3着は流す。全体で8点程度を基本とする。2着を絞ることで点数を管理し、3着の取りこぼしを防ぐ設計"
    tags: [box_bet, second_place, third_place, bet_count]

  - id: R3
    text: "軸候補の選定は「節間成績 ＞ 展示ST ＞ 当地3連率」の優先順位で見る。節間成績が最も直近の状態を反映するため最優先。ただし優先度は会場特性により変動するため、会場別ルールを併用する"
    tags: [current_series, exhibition_st, local_3rate, axis_selection, priority]

  - id: R4
    text: "「結論先行で条件を整合させていないか」を最後に必ず自問する。これは古川さん自身とClaude双方に適用する。特にClaudeは先に本命を決めてから根拠を並べる傾向があるため、根拠→結論の順序が保たれているかを確認すること"
    tags: [meta, self_check]

  - id: R5
    text: "期別コース別2連率と当地勝率は、どちらか一方ではなく両方を確認する。乖離の大小で優先順位を決めるのではなく、両方の情報を持った上で判断する"
    tags: [period_stats, local_winrate, course_stats]

  - id: R7
    text: "市場本命（オッズ最低の組み合わせ）を買い目に含める場合、必ずトリガミ回避額を投入する。中途半端な額は入れない。トリガミ回避額が確保できない場合でも、切る判断は慎重に行う（R15と連動）"
    tags: [odds, trigami, favorite]

  - id: R8
    text: "Claudeは予想の各段階で、全ジェネラルルールおよび会場別・条件別ルールを参照済みかを自己点検する。適用したルールと、検討したが適用しなかったルールを出力に明記すること。ルールファイルに存在しない判断基準を新たに用いてはならない。既存ルールで判断できない場面に遭遇した場合は、その場で基準を作って適用するのではなく、判断に迷った事実を出力に明記し、古川さんの判断を仰ぐこと。ルール番号を自分で採番することは禁止する。派生形（「R◯-改」「R◯案」「条件A/B/C」等）の作成も同様に禁止する。新しい基準が必要だと考える場合は、提案として出力し、採否の判断は古川さんが行う"
    tags: [meta, checklist, claude_self_check]

  - id: R11
    text: "モーター2連率0.00%は初期減点の対象とする。ただし当節の仕上がり（節間成績・展示タイム）で評価が覆る場合があるため、減点を出発点として当節データで再評価する"
    tags: [motor, initial_deduction, current_series]

  - id: R12
    text: "過去成績が悪い選手でも、当節の状態が良ければ3着付けで残す。判断は節間成績の上向きを基本とし、展示タイム・展示ST・体重・チルトを複合的に見る。金額は固定せず、オッズと予算構成に応じて決める。オッズ20倍超の中穴で「過去データ最悪・展示好調」の組み合わせは特に妙味が大きい（旧R14を統合）"
    tags: [current_series, exhibition, third_place, middle_odds]
    origin: "住之江8R（2026-05-03）での実戦学習（3号艇有山の3着を取りこぼした）"

  - id: R13
    text: "6艇編成をA級と切る選手だけで判断せず、展示で光った選手を必ず1〜2人3着候補に入れる。「光った」の判断は単一指標ではなく、展示タイム順位・展示STの鋭さ・節間成績の上向きを複合的に見る"
    tags: [class, exhibition, third_place]

  - id: R15
    text: "予算を圧縮する際は「本線の厚張り分」から削る。当節の状態を根拠に残した3着付け中穴の100〜200円ラインは原則削らない。中穴が削られた瞬間、妙味枠の機能が消滅する（注：予算圧縮が発生する場面自体が稀であり、実戦での検証機会は少ない）"
    tags: [budget, middle_odds, priority, current_series]
    origin: "平和島12R（2026-05-04）での実戦学習"

  - id: R16
    text: "モーターは展示タイムとセットで見る。展示タイムを優先し、モーターの数値はその裏付けとして扱う。モーター単独の数値で軸を決めない"
    tags: [motor, exhibition_time, axis_selection]
    origin: "2026-08-02 のルール改正時に、実際の判断基準を言語化して追加"

  - id: R17
    text: "節間成績は「節全体で3着以内が半数以上なら上向き、半数未満なら下降」で判定する。ちょうど半数（6走3回など）は「半数以上」に含めるため上向きとする。上向き・下降は同等に重視し、上向きなら評価を一段上げ、下降なら一段下げる。軸への格上げや切りの直接的な根拠にはしない。進入コースは問わず全体の調子で判定する（同コースの実績は参考）。着順が数値でない走（転・エ・F等）は出走には数えるが3着以内には数えない。出走2走以下でも判定は出すが信頼度が低いものとして扱い、評価の増減は控えめにする。初日など節間成績が無い場合は判定不能とし、展示情報を重視した判断に切り替える"
    tags: [current_series, trend, evaluation, exhibition]
    origin: "2026-08-02 のルール改正時に、実際の判断基準を言語化して追加"

  - id: R18
    text: "買い目の採否は的中率を主軸に判断する。期待値は参考指標であり、単独で採否を決める基準にはしない。期待値を見る場合は絶対値ではなく候補内の相対順位で比較する。3連単の控除率は約25%であり、オッズが内包する確率の合計は約133%になるため、全買い目の期待値は構造的にマイナスに偏る。絶対値で判定すると市場人気の上位が常に切りと判定され、買い目が意図せず中穴に漂流する。なお R15（予算圧縮時に中穴を残す）とは適用場面が異なる。R15 は既に組んだ買い目から削る場面のルールであり、R18 は買い目を組む段階での主軸の置き方を定める"
    tags: [odds, expected_value, hit_rate, bet_selection]
    origin: "2026-08-13 蒲郡での運用中に検出された問題への対処。N=3の観測に基づく暫定ルールであり、運用の中で収支を悪化させる場合は見直す"
