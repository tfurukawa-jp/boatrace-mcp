# 予想レポート出力フォーマットガイド
# 適用条件: 買い目案の提示・最終予想・「予算◯円で予想して」等の最終アウトプット文脈
# 適用しない条件: 個別選手への質問・データ確認・対話途中・シンプルな計算結果

id: output_format_v1

apply_when:
  - "買い目を提示するとき"
  - "最終的な予想を出すとき"
  - "「予算◯円で予想して」と依頼されたとき"
  - "「◯Rを分析して」と依頼されたとき"

do_not_apply_when:
  - "個別選手・モーター・天候などの単体質問"
  - "データ確認・計算のみの依頼"
  - "会話の途中段階"

format: |
  # 🚤 [会場][レース番号] 分析レポート

  ## 📋 レース情報
  - 距離 / 安定板 / 風向・風速 / 波高 / 時間帯
  - 編成サマリ（例: A1×2、A2×2、B1×2）

  ## 🎯 結論
  1着候補と本命軸の一行サマリ（例: 「1コース◯◯が本命、2-3着は混戦」）

  ## 🏆 推奨買い目（予算◯円）
  | # | 買い目 | オッズ | 賭金 | 想定収支 |
  |---|--------|--------|------|----------|
  | 1 | X-X-X  | XX.X倍 | XXXX円 | +XXXX円 |

  - 合計投資: ◯円
  - トリガミ回避ライン: ◯倍以上で的中なら黒字
  - 最大想定払戻: ◯円

  ## 🔍 各艇評価
  - 🥇 **1号艇 [選手名]**（★本命軸）: 根拠2〜3行
  - 🥈 **2号艇 [選手名]**（★2着候補）: 根拠2〜3行
  - ✂️ **3号艇 [選手名]**（切り）: 根拠1行
  ※ 全6艇を評価ラベル付きで記載

  ## ⚠️ 適用した学習ルール
  - ✅ R1: [適用内容]
  - ✅ R◯: [適用内容]

  ## 💡 戦略メモ
  このレースの本質的な構造・勝負どころの所感（200文字以内）

  ## 📊 直近収支
  （get_pnl_summaryで今月の収支を取得して表示。取得できない場合は省略）

notes:
  - "絵文字は積極的に使う"
  - "表はMarkdown table形式で出力する"
  - "セクション区切りは ## 見出し で明確にする"
  - "全体を1ページ相当（スマホで2〜3スクロール）に収める"
  - "評価ラベル: ★本命軸 / ★2着候補 / ★3着付け / 切り"
