# 津競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 9
venue_name: 津
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 東海（三重県）

characteristics:
  - "伊勢湾に面した海水コース"
  - "1コース1着率 55.0%（24場中16位）。24場平均55.2%とほぼ同じ（-0.2ポイント）"
  - "2コース1着率 16.1%（24場中4位）。イン以外では2コースが明確に強い"
  - "外枠（4〜6コース）の1着率合計 18.1%（24場中14位）。ほぼ全国中位"
  - "冬季のイン有利が最も強い（春58.1 / 夏55.3 / 秋58.2 / 冬62.1%）"
  - "【未検証】水面は比較的穏やかだが向風が強い日は波が立つ"
  - "【未検証】ナイター開催あり。夜間帯は水面が安定しやすい"
  - "【未検証】強い向風の日はインが失速しやすく、まくりが成立しやすくなる"

cautions:
  - "【要効果検証】実測は24場平均とほぼ同じ（16位）。イン有利を強くも弱くも見積もらない"
  - "【要効果検証】2コース1着率16.1%（全国4位）は高い。2着専用の枠として扱わず1着候補にも入れる"
  - "【要効果検証】冬季は62.1%まで上がる。季節別データを確認する"
  - "【未検証】伊勢湾からの風が強い日は水面が荒れやすい。風速・風向を確認する"

recommended_strategy:
  - "【要効果検証】1コース軸の標準的な組み立て。実測55.0%は平均どおり"
  - "【要効果検証】2コースを1着候補としても評価する（16.1%・全国4位）"
  - "【要効果検証】冬季はイン有利が強まるため点数を絞る方向に寄せる"
  - "【未検証】向風6m超の日はイン信頼度を下げ、3〜4コースのまくりを軸候補に切り替える"
