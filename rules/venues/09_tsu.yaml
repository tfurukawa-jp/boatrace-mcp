# 津競艇場ルール
venue_id: 9
venue_name: 津
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 東海（三重県）

characteristics:
  - "伊勢湾に面した海水コース。水面は比較的穏やかだが向風が強い日は波が立つ"
  - "1コース1着率は全国平均程度（51〜53%）"
  - "ナイター開催あり。夜間帯は水面が安定しやすい"
  - "強い向風の日はインが失速しやすく、まくりが成立しやすくなる"

cautions:
  - "伊勢湾からの風が強い日は水面が荒れやすい。風速・風向の確認を必ずする"
  - "ナイター帯のトリガミに注意。1コース本命時はR7を適用する"

recommended_strategy:
  - "微風・穏やか日：1コース軸の本命中心。展示ST上位を2-3着に組み合わせる"
  - "向風6m超の日：イン信頼度を下げ、3〜4コースのまくりを軸候補に切り替える"
  - "ナイター帯は1コース固定で2〜3着を広げる基本戦略を適用"
