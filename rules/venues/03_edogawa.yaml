# 江戸川競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 3
venue_name: 江戸川
water_type: brackish         # 汽水（荒川から引き込んだ河川水面）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（東京都）

characteristics:
  - "全国唯一の河川水面"
  - "1コース1着率 45.4%（24場中22位）。24場平均55.2%を9.8ポイント下回る"
  - "外枠（4〜6コース）の1着率合計 22.3%（24場中2位）。外枠が1着に来る頻度は戸田に次ぐ"
  - "6コース1着率 3.3%（24場中1位・全国最高）。6コースの1着が全国で最も多い"
  - "2コース17.2%（3位）・3コース16.7%（3位）も高く、1着が分散する"
  - "季節差が小さく通年でインが弱い（春48.8 / 夏47.6 / 秋47.5 / 冬47.9%）"
  - "【未検証】干満の影響で流れが発生し、水面が激しく変化する"
  - "【未検証】波高が高くなりやすく、重い選手（体重55kg超）は操艇が難しくなる"
  - "【未検証】強風・大波のときは安定板を使用。安定板使用時はイン有利に傾くが2-3着は荒れる"
  - "【未検証】満潮・干潮のタイミングで水位が変わり、同じレースでも難易度が変化する"

cautions:
  - "【要効果検証】他場と同じイン優先の思考を持ち込まない。実測でも24場中22位でインが弱い"
  - "【要効果検証】外枠を軽視しない。6コース1着率3.3%は全国最高で、4〜6コース合計22.3%も全国2位"
  - "【要効果検証】ただし戸田38.7%ほど極端ではない。「全国最低クラス」ではなく下から3番目という位置づけ"
  - "【未検証】当日の潮位・風向・波高を確認する。荒れ水面では予想の前提が崩れやすい"
  - "【未検証】体重の軽い選手が荒れ水面で有利になりやすい。体重欄を確認する"
  - "【未検証】安定板使用の有無を直前情報で確認してから買い目を決める"

recommended_strategy:
  - "【要効果検証】1コース固定は避け、複数の軸候補を用意する。実測45.4%が支持しない"
  - "【要効果検証】2・3コースを1着候補として評価する（17.2% / 16.7%、ともに全国3位）"
  - "【要効果検証】6コースの1着を完全には切らない（3.3%・全国最高）"
  - "【未検証】波高3cm以上のときは体重の軽い選手（52kg以下）を優先評価する"
  - "【未検証】安定板使用時のみ1コース軸を検討する"
