# 江戸川競艇場ルール
venue_id: 3
venue_name: 江戸川
water_type: brackish         # 汽水（荒川から引き込んだ河川水面）
course_length: 1200
stable_board_used: conditional  # 荒天時のみ安定板使用（常時ではない）
night_race: false
region: 関東（東京都）

characteristics:
  - "全国唯一の河川水面。干満の影響で流れが発生し、水面が激しく変化する"
  - "1コース1着率は全国最低クラス（40〜45%）。全場で最もインが弱い難水面"
  - "波高が高くなりやすく、重い選手（体重55kg超）は操艇が難しくなる"
  - "アウトコース（4〜6コース）のまくりが全国で最も成立しやすい場"
  - "強風・大波のときは安定板を使用。安定板使用時はイン有利に傾くが2-3着は荒れる"
  - "満潮・干潮のタイミングで水位が大きく変わり、同じレースでも難易度が変化する"

cautions:
  - "当日の潮位・風向・波高を必ず確認。荒れ水面では予想の前提が崩れやすい"
  - "他場と同じイン優先の思考を持ち込まない。ここでは外枠を軽視しない"
  - "体重の軽い選手が荒れ水面で有利になりやすい。体重欄を必ず確認する"
  - "安定板使用の有無を直前情報で必ず確認してから買い目を決める"

recommended_strategy:
  - "荒れ水面を前提に複数の軸候補を用意。1コース固定は危険"
  - "波高3cm以上：体重軽い選手（52kg以下）を優先評価。外枠まくりを軸候補に"
  - "安定板使用時のみ1コース軸を検討。それ以外は3〜4コースを軸にした穴狙いを基本とする"
  - "荒れる展開を想定して配当は高めに設定。少点数で中穴〜大穴を狙うスタイルが有効"
