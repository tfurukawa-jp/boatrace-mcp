# 丸亀競艇場ルール
venue_id: 15
venue_name: 丸亀
water_type: seawater         # 海水（瀬戸内海）
course_length: 1800
stable_board_used: false
night_race: false
region: 四国（香川県）

characteristics:
  - "瀬戸内海の穏やかな水面。波が立ちにくく水面が安定している"
  - "1コース1着率が全国屈指の高さ（60%超え）。全国有数のイン最強場"
  - "1800mと距離が長いが、水面の穏やかさでインの逃げが決まりやすい"
  - "外枠からのまくりが成立しにくい環境。外枠はほぼ3着争いになりやすい"
  - "荒れにくく本命決着が非常に多い。配当は低め傾向"

cautions:
  - "1コース本命オッズが非常に低くなる。トリガミ回避ライン確認（R7）が特に重要"
  - "外枠の1着を過度に期待しない。4〜6コースの1着率は全国でも低い部類"
  - "荒れ狙いの大穴買いは基本的に不向きな場"

recommended_strategy:
  - "1コース1着固定が基本戦略。2-3着を3〜4艇に広げてトリガミ回避ラインを確保"
  - "住之江と同様、展示ST最上位がアウト（4〜6コース）の場合のみ1コース切りを検討"
  - "購入点数を絞り、1点あたりの賭け金を増やしてトリガミ回避を徹底する"
