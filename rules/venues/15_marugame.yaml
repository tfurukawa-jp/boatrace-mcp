# 丸亀競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 15
venue_name: 丸亀
water_type: seawater         # 海水（瀬戸内海）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 四国（香川県）

characteristics:
  - "瀬戸内海に面した海水コース"
  - "1コース1着率 56.1%（24場中14位）。24場平均55.2%を0.9ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 18.1%（24場中15位）。ほぼ全国中位"
  - "6コース1着率 2.3%（24場中7位）。6コースの1着は少なくない部類"
  - "春・夏にイン有利が強まる（春59.1 / 夏58.3 / 秋55.3 / 冬53.6%）"
  - "【未検証】波が立ちにくく水面が安定している"
  - "【未検証】1800mと距離が長い"

cautions:
  - "【要効果検証】「全国屈指の高さ（60%超え）」「イン最強場」ではない。実測は56.1%で24場中14位"
  - "【要効果検証】外枠の1着を「全国でも低い部類」として切らない。18.1%は24場中15位でほぼ中位"
  - "【要効果検証】6コース1着率2.3%は24場中7位。他場より1着の目が残る"
  - "【要効果検証】冬季は53.6%まで下がる。季節別データを確認する"

recommended_strategy:
  - "【要効果検証】1コース軸を基本とするが、1点集中は避ける。実測56.1%は平均をわずかに上回る程度"
  - "【要効果検証】2着を絞り3着を流す（R2）を素直に適用する"
  - "【要効果検証】外枠は3着付けで残す。機械的な切りはしない（18.1%・中位水準）"
  - "【要効果検証】展示ST最上位がアウト（4〜6コース）の場合は1コース切りを検討する"
