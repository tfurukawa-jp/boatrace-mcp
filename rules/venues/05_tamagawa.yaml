# 多摩川競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 5
venue_name: 多摩川
water_type: freshwater       # 淡水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（東京都）

characteristics:
  - "1コース1着率 57.1%（24場中11位）。24場平均55.2%を1.9ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 18.2%（24場中13位）。ほぼ全国中位"
  - "3コース1着率 11.7%（24場中19位）と低く、イン以外では2コース13.3%が中心"
  - "冬季のイン有利が最も強い（春54.0 / 夏51.5 / 秋52.4 / 冬56.2%）"
  - "【未検証】1800mと距離が長め。コーナーワークの技術差が出やすい"
  - "【未検証】水面は比較的穏やかで荒れにくい"
  - "【未検証】東京都内のため偏り風が少なく、比較的条件が安定しやすい"

cautions:
  - "【要効果検証】「全国平均程度」ではなく、実測はやや平均を上回る（11位）"
  - "【要効果検証】3コースを1着候補として重く見ない（11.7%・24場中19位）"
  - "【未検証】1800mのため展示タイムと実際の機力の差が出やすい"
  - "【未検証】荒れにくい場のため大穴を過度に期待しない"

recommended_strategy:
  - "【要効果検証】1コース軸の本命〜中本命。実測57.1%はイン有利がやや強い水準"
  - "【要効果検証】2着は2コース（13.3%）を中心に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。1着付けは中位水準（18.2%）を踏まえて限定的に"
  - "【要効果検証】冬季はイン有利がさらに強まる（56.2%）。季節別データを併せて確認する"
