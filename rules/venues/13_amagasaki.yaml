# 尼崎競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 13
venue_name: 尼崎
water_type: seawater         # 海水（内海）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関西（兵庫県）

characteristics:
  - "内海（大阪湾の奥）に位置する"
  - "1コース1着率 61.5%（24場中3位）。24場平均55.2%を6.3ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 14.6%（24場中22位）。外枠の1着は全国で3番目に少ない"
  - "6コース1着率 0.9%（24場中23位）。6コースの1着はほぼ期待できない"
  - "季節差は小さくイン有利が通年で安定（春61.4 / 夏56.2 / 秋61.1 / 冬61.8%）"
  - "【未検証】波が立ちにくく水面が非常に穏やか"
  - "【未検証】風の影響が少なく、展示タイム・展示STが素直に本番に反映されやすい"

cautions:
  - "【要効果検証】「全国平均よりやや高め」ではない。実測はイン有利が24場中3位と強い"
  - "【要効果検証】外枠の1着を期待しない（4〜6コース合計14.6%・22位）"
  - "【要効果検証】本命オッズが低くなりやすい。トリガミ回避ライン（R7）の確認を必須とする"
  - "【要効果検証】夏季のみ56.2%とやや落ちる（他季は61%台）。季節別データを確認する"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測61.5%は全国3位"
  - "【要効果検証】2着を2〜3艇に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。6コースの1着付けは実測が支持しない（0.9%）"
  - "【要効果検証】点数を絞り1点あたりの賭け金を増やす方針が合う。ただしR7の確認を欠かさない"
