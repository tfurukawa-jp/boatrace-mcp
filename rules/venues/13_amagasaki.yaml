# 尼崎競艇場ルール
venue_id: 13
venue_name: 尼崎
water_type: seawater         # 海水（内海）
course_length: 1200
stable_board_used: false
night_race: false
region: 関西（兵庫県）

characteristics:
  - "内海（大阪湾の奥）に位置し、波が立ちにくく水面が非常に穏やか"
  - "1コース1着率は全国平均よりやや高め（53〜55%）。穏やかな水面でイン有利が安定"
  - "風の影響が少なく、展示タイム・展示STが素直に本番に反映されやすい"
  - "荒れにくい場。本命決着が多く、配当は低め傾向"

cautions:
  - "穏やかすぎる水面のため、本命オッズが特に低くなりやすい。トリガミ回避確認（R7）必須"
  - "荒れを期待して大穴狙いは基本的に不向きな場"

recommended_strategy:
  - "1コース軸の本命中心。展示ST・展示タイム上位なら迷わず1着固定"
  - "2-3着は展示ST上位を2〜3艇に絞って購入。広げすぎない"
  - "配当が低い前提で購入点数を絞り、トリガミ回避ラインを確保する"
