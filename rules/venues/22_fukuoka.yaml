# 福岡競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 22
venue_name: 福岡
water_type: seawater         # 海水（博多湾）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 九州（福岡県）

characteristics:
  - "博多湾の内湾に位置する"
  - "1コース1着率 59.0%（24場中5位）。24場平均55.2%を3.8ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 11.6%（24場中24位・全国最低）。外枠の1着が全国で最も少ない"
  - "3コース1着率 15.9%（24場中4位）・2コース1着率 14.3%（24場中8位）。イン以外では中枠に集中する"
  - "1コースと2・3コースで1着の98%近くを占め、4コース以降がほぼ絡まない構造"
  - "春季のイン有利が最も強い（春62.0 / 夏55.1 / 秋56.4 / 冬58.1%）"
  - "【未検証】水面が非常に穏やかで荒れにくい"
  - "【未検証】ナイター開催あり。夜間帯は水面が安定しやすくイン有利が強まる"

cautions:
  - "【要効果検証】「全国平均程度〜やや高め」ではない。実測はイン有利が24場中5位と強い"
  - "【要効果検証】外枠の1着を期待しない。4〜6コース合計11.6%は全国最低"
  - "【要効果検証】一方で3コースは15.9%（全国4位）と高い。外枠と中枠を同一視しない"
  - "【未検証】ナイター帯は1コース本命オッズが低くなりやすい。R7の確認が特に重要"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測59.0%は全国5位"
  - "【要効果検証】2着候補は3コース（15.9%）と2コース（14.3%）に絞る"
  - "【要効果検証】外枠は3着付けに限定する。1着付けは実測が支持しない（全国最低）"
  - "【要効果検証】点数を絞り1点あたりの賭け金を増やす方針が合う。R7の確認を欠かさない"
