# 児島競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 16
venue_name: 児島
water_type: seawater         # 海水（瀬戸内海）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 中国（岡山県）

characteristics:
  - "瀬戸内海に面した海水コース"
  - "1コース1着率 52.9%（24場中19位）。24場平均55.2%を2.3ポイント下回る"
  - "外枠（4〜6コース）の1着率合計 20.7%（24場中4位）。外枠が1着に来る頻度は高い部類"
  - "3コース1着率 14.8%（24場中6位）。イン以外では3コースが強い"
  - "6コース1着率 1.1%（24場中22位）。外枠のうち1着に絡むのは主に4コース"
  - "春・夏にイン有利が強まる（春57.8 / 夏58.7 / 秋52.5 / 冬54.7%）"
  - "【未検証】比較的穏やかな水面で荒れにくい"
  - "【未検証】1800mと距離が長く、伸び足のある艇が有利になりやすい"

cautions:
  - "【要効果検証】「全国平均程度」「平均的な場」として扱わない。実測は平均を下回り（19位）、外枠は全国4位に強い"
  - "【要効果検証】3コースを1着候補として評価する（14.8%・全国6位）"
  - "【要効果検証】6コースは1.1%（22位）。外枠のうち評価を上げるのは4コースまでにとどめる"
  - "【要効果検証】季節差が5〜6ポイントある。季節別データを確認する"

recommended_strategy:
  - "【要効果検証】1コース単独軸にはしない。実測52.9%は平均を下回る"
  - "【要効果検証】3コースを1着候補として組み込む（14.8%・全国6位）"
  - "【要効果検証】外枠を軽視しない（4〜6コース合計20.7%・全国4位）。ただし1着付けは4コース中心"
  - "【未検証】1800mの伸び足重視。展示タイムが突出している艇を軸候補の上位に置く"
