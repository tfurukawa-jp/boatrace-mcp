# 平和島競艇場ルール
venue_id: 4
venue_name: 平和島
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false            # デイ開催
region: 東京

characteristics:
  - "【重要】通常は1800m。強風・荒天時のみ1200mに短縮される。毎レース前に直前情報で必ず距離を確認すること"
  - "1200m短縮＋安定板使用時はR1ルール直結：イン有利だが2-3着は荒れる。この条件は毎回ではない"
  - "1800m通常時はイン受難場。1コース1着率44〜46%で全国平均より低い"
  - "向風強風時は中枠（3〜4コース）まくりが成立しやすい"
  - "海水コース。潮の干満で水面状況が変化する"
  - "6艇A1編成でも強風時には典型出目「3-1-5」「中枠まくり→6号艇差し」が現れる"

cautions:
  - "「平和島＝1200m」と決めつけない。1200mは荒天時の短縮コースであり、通常は1800m"
  - "1コースを過信しない。1800m時は特にイン受難。当日の風向・風速を必ずチェック"
  - "安定板使用の有無を直前情報で確認してから買い目を決める（1200m時のみ使用）"
  - "干潮・満潮のタイミングでターン幅が変わる。時間帯の水面変化に注意"

recommended_strategy:
  - "分析開始時に必ず「1800mか1200mか」を直前情報で確認し、どちらの条件で戦略を立てるか明示する"
  - "1200m＋安定板使用時：1コース軸にしつつ、2-3着は4〜5艇に広げる（R1＋R2）"
  - "1800m通常時：イン受難を前提に。向風6m超なら1コース切りも検討、3コースまくりを軸に"
  - "全コース選手を中穴扱いで少額残す戦略（R12・R13・R14）が功を奏しやすい場"
