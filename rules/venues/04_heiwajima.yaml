# 平和島競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 4
venue_name: 平和島
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false            # デイ開催
region: 東京

characteristics:
  - "【重要】通常は1800m。強風・荒天時のみ1200mに短縮される。毎レース前に直前情報で必ず距離を確認すること"
  - "1コース1着率 44.7%（24場中23位）。24場平均55.2%を10.5ポイント下回る"
  - "2コース1着率 18.9%（24場中1位・全国最高）・3コース1着率 18.5%（24場中1位・全国最高）"
  - "外枠（4〜6コース）の1着率合計 19.3%（24場中7位）"
  - "6コース1着率 1.7%（24場中14位）。外枠のうち1着に絡むのは主に4コース"
  - "冬季のイン有利が最も弱い（春49.1 / 夏47.2 / 秋49.4 / 冬45.1%）"
  - "【未検証】1200m短縮＋安定板使用時はR1直結：イン有利だが2-3着は荒れる"
  - "【未検証】向風強風時は中枠（3〜4コース）まくりが成立しやすい"
  - "【未検証】海水コースで、潮の干満で水面状況が変化する"
  - "【未検証】6艇A1編成でも強風時には典型出目「3-1-5」「中枠まくり→6号艇差し」が現れる"

cautions:
  - "【要効果検証】「平和島＝1200m」と決めつけない。1200mは荒天時の短縮コースであり、通常は1800m"
  - "【要効果検証】1コースを過信しない。実測44.7%は24場中23位で、戸田に次いでインが弱い"
  - "【要効果検証】2・3コースの1着はいずれも全国最高。中枠を1着候補から外さない"
  - "【要効果検証】6コースは1.7%（14位）と平凡。外枠のうち評価を上げるのは4コースまでにとどめる"
  - "【未検証】安定板使用の有無を直前情報で確認してから買い目を決める"
  - "【未検証】干潮・満潮のタイミングでターン幅が変わる"

recommended_strategy:
  - "【要効果検証】分析開始時に必ず「1800mか1200mか」を直前情報で確認し、どちらの条件で戦略を立てるか明示する"
  - "【要効果検証】1コース固定は避ける。2・3コースを1着候補として明確に評価する（18.9% / 18.5%、ともに全国1位）"
  - "【要効果検証】中穴狙い（R12・R13）が機能しやすい場。1着が分散するため点数を絞りすぎない"
  - "【未検証】1200m短縮＋安定板使用時：1コース軸にしつつ2-3着を4〜5艇に広げる（R1＋R2）"
