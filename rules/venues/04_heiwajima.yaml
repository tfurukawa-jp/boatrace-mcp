# 平和島競艇場ルール
venue_id: 4
venue_name: 平和島
water_type: seawater         # 海水
course_length: 1200          # メートル（安定板使用条件あり）
stable_board_used: true      # 強風・荒天時に安定板使用あり（R1直結）
night_race: false            # デイ開催
region: 東京

characteristics:
  - "海水コース。潮の干満で水面状況が変化する"
  - "1200m＋安定板使用時はR1ルール直結：イン有利だが2-3着は荒れる"
  - "1コース1着率44〜46%。全国平均より低く、イン受難場の傾向"
  - "向風強風時は中枠（3〜4コース）まくりが成立しやすい"
  - "6艇A1編成でも強風時には典型出目「3-1-5」「中枠まくり→6号艇差し」が現れる"

cautions:
  - "1コースを過信しない。当日の風向・風速（conditions.yamlの向風6m以上）を必ずチェック"
  - "安定板使用の有無を直前情報で確認してから買い目を決める"
  - "干潮・満潮のタイミングでターン幅が変わる。ナイター競走はないが時間帯の水面変化に注意"

recommended_strategy:
  - "安定板使用時：1コース軸にしつつ、2-3着は4〜5艇に広げる（R1＋R2）"
  - "向風6m超時：1コース切りも検討。3コース選手のまくりを軸に"
  - "全コース選手を中穴扱いで少額残す戦略（R12・R13・R14）が功を奏しやすい場"
