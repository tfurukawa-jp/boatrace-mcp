# 若松競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 20
venue_name: 若松
water_type: seawater         # 海水（洞海湾）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 九州（福岡県）

characteristics:
  - "洞海湾の内湾に位置する"
  - "1コース1着率 58.9%（24場中6位）。24場平均55.2%を3.7ポイント上回る"
  - "3コース1着率 10.9%（24場中22位）と低い。イン以外では2コース13.7%が中心"
  - "外枠（4〜6コース）の1着率合計 16.9%（24場中18位）。外枠の1着は少ない部類"
  - "冬季のイン有利が突出（春59.3 / 夏55.1 / 秋57.9 / 冬64.0%）"
  - "【未検証】水面は比較的穏やかで、内湾のため風の影響は中程度"
  - "【未検証】潮の干満の影響は緩やかにある"

cautions:
  - "【要効果検証】「特別な特性が少ない標準的な場」として扱わない。実測はイン有利が24場中6位と強い"
  - "【要効果検証】3コースを1着候補として重く見ない（10.9%・24場中22位）"
  - "【要効果検証】冬季は64.0%まで上がる。季節別データを確認する"
  - "【未検証】風が強い日は内湾でも向風の影響が出ることがある"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測58.9%は全国6位"
  - "【要効果検証】2着は2コース（13.7%）を軸に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。1着付けは実測が支持しない（16.9%・18位）"
  - "【要効果検証】冬季はさらに点数を絞る方向に寄せる。低オッズになるためR7を確認する"
