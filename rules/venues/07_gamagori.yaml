# 蒲郡競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 7
venue_name: 蒲郡
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 東海（愛知県）

characteristics:
  - "三河湾の内海に位置する"
  - "1コース1着率 54.4%（24場中17位）。24場平均55.2%を0.8ポイント下回る"
  - "外枠（4〜6コース）の1着率合計 20.4%（24場中5位）。外枠が1着に来る頻度は高い部類"
  - "6コース1着率 2.5%（24場中4位）"
  - "季節差が大きい（春56.4 / 夏51.7 / 秋65.7 / 冬58.3%）。秋は24場平均を10ポイント上回る"
  - "【未検証】水面は非常に穏やかで波が立ちにくい"
  - "【未検証】ナイター開催あり。夜間帯はモーター出力がUPしイン有利が強まる傾向"
  - "【未検証】穏やかな水面でスタートが決まりやすく、展示STどおりの結果になりやすい"

cautions:
  - "【要効果検証】「全国平均よりやや高め」ではない。実測は平均をわずかに下回る（17位）"
  - "【要効果検証】外枠を軽視しない（4〜6コース合計20.4%・全国5位）"
  - "【要効果検証】季節差が大きい場。秋季65.7%と夏季51.7%では14ポイント違う。季節別データを必ず確認する"
  - "【未検証】ナイター帯はイン本命のオッズが低くなりやすい。R7を適用する"

recommended_strategy:
  - "【要効果検証】1コース軸は可能だが単独固定にはしない。実測54.4%は平均並み"
  - "【要効果検証】外枠を1着候補から機械的に外さない（20.4%・全国5位）"
  - "【要効果検証】秋季はイン有利が大きく強まる（65.7%）。季節に応じて方針を切り替える"
  - "【未検証】展示ST・展示タイムが素直に結果へ反映されるため、データを重視して組み立てる"
