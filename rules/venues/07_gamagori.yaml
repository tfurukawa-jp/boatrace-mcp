# 蒲郡競艇場ルール
venue_id: 7
venue_name: 蒲郡
water_type: seawater         # 海水
course_length: 1200
stable_board_used: false
night_race: true             # ナイター開催あり
region: 東海（愛知県）

characteristics:
  - "三河湾の内海に位置し、水面は非常に穏やか。波が立ちにくい"
  - "1コース1着率は全国平均よりやや高め（53〜55%）"
  - "ナイター開催あり。夜間帯はモーター出力がUPしイン有利がさらに強まる傾向"
  - "穏やかな水面でスタートが決まりやすく、展示STどおりの結果になりやすい"

cautions:
  - "穏やかすぎる水面のため、展示タイムと展示STが素直に結果に反映される。データを信頼してよい"
  - "ナイター帯はトリガミに注意。イン本命のオッズが特に低くなりやすい（R7必須）"

recommended_strategy:
  - "1コース軸の本命〜中本命。展示ST・展示タイムが良ければ迷わず1着固定"
  - "ナイター帯は特に1コース信頼度が高い。2-3着を3〜4艇に広げてトリガミ回避ラインを確認"
  - "穏やかな水面なので荒れ狙いは基本不要。堅い配当を積み上げる場"
