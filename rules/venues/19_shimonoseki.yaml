# 下関競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 19
venue_name: 下関
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 中国（山口県）

characteristics:
  - "関門海峡に近い海水コース"
  - "1コース1着率 62.2%（24場中2位）。24場平均55.2%を7.0ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 16.2%（24場中19位）。外枠が1着に来ることは少ない部類"
  - "2コース1着率 11.1%（24場中23位）。イン以外で突出したコースがなく、1コースに集中する構造"
  - "【未検証】潮流の影響が出やすく、潮流が速い時間帯はターンが難しくなる"
  - "【未検証】関門海峡からの風が強い日は水面が荒れやすい"

cautions:
  - "【要効果検証】「全国平均程度」として扱わない。実測ではイン有利が24場中2番目に強い場である"
  - "【要効果検証】1コース本命のオッズが低くなりやすい。トリガミ回避ライン（R7）の確認が重要"
  - "【要効果検証】強風・潮流を理由にイン信頼度を下げる場合も、基準は62.2%（全国2位）であることを踏まえる。下げ幅を取りすぎない"
  - "【要効果検証】外枠の台頭を想定する場合も、4〜6コース合計16.2%という水準から出発する"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測62.2%は全国2位"
  - "【要効果検証】2着は絞り、3着を流す（R2）。イン以外で突出したコースがないため、2着候補の選定は展示・節間成績で判断する"
  - "【要効果検証】強風・潮流が速い時間帯は3〜4コースを2着候補に格上げして対応する。1着候補への格上げは実測が支持しない"
  - "【要効果検証】向風が強い日は条件別ルール（向風6m以上）を適用するが、イン切りまでは踏み込まない"
