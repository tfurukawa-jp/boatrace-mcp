# 下関競艇場ルール
venue_id: 19
venue_name: 下関
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 中国（山口県）

characteristics:
  - "関門海峡に近い海水コース。潮流の影響が出やすい"
  - "1コース1着率は全国平均程度（50〜52%）"
  - "関門海峡からの風が強い日は水面が荒れやすく、外枠が台頭しやすくなる"
  - "潮流が速い時間帯はターンが難しくなり、荒れた結果になりやすい"

cautions:
  - "潮流・風向の確認が重要。特に強風時はイン信頼度を下げる"
  - "向風が強い日は条件別ルール（向風6m以上）を必ず適用"

recommended_strategy:
  - "穏やか日：1コース軸の標準的な組み立て"
  - "強風・潮流が速い時間帯：3〜4コースのまくりを軸候補に。外枠を軽視しない"
  - "基本ルール（R1〜R14）＋条件別ルールを組み合わせて適用"
