# 三国競艇場ルール
venue_id: 10
venue_name: 三国
water_type: seawater         # 海水（九頭竜川河口）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 北陸（福井県）

characteristics:
  - "九頭竜川河口に位置し、日本海側の強風が吹き込みやすい。荒れやすい場"
  - "1コース1着率は全国平均より低め（49〜51%）。風が強い日はさらに下がる"
  - "潮の干満と河口の流れが重なり、水面コンディションが変化しやすい"
  - "強風日は安定板を使用。安定板使用時はインが有利になるが2-3着は荒れる（R1連動）"
  - "冬場は特に風が強く、荒れ水面になりやすい"

cautions:
  - "風速・風向を必ず確認。三国は全国でも特に風の影響が大きい場"
  - "安定板使用の有無を直前情報で確認してから買い目を組む"
  - "穏やかな日でも潮位変化で展示と本番でコンディションが変わる可能性がある"

recommended_strategy:
  - "強風（向風6m超）＋安定板なし：1コース切りも検討。3〜4コースまくりを軸に"
  - "安定板使用時：1コース軸にしつつ2-3着を4〜5艇に広げる（R1適用）"
  - "穏やかな日のみ本命中心。基本的には荒れを想定した中穴狙いが有効な場"
