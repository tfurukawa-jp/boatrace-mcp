# 三国競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 10
venue_name: 三国
water_type: seawater         # 海水（九頭竜川河口）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 北陸（福井県）

characteristics:
  - "九頭竜川河口に位置する"
  - "1コース1着率 50.3%（24場中21位）。24場平均55.2%を4.9ポイント下回る"
  - "2コース1着率 16.0%（24場中5位）・3コース1着率 14.3%（24場中9位）。中枠が強い"
  - "外枠（4〜6コース）の1着率合計 20.4%（24場中6位）"
  - "6コース1着率 2.5%（24場中5位）"
  - "冬季のイン有利が最も強く、春が最も弱い（春49.1 / 夏53.5 / 秋51.4 / 冬54.4%）"
  - "【未検証】日本海側の強風が吹き込みやすい"
  - "【未検証】潮の干満と河口の流れが重なり、水面コンディションが変化しやすい"
  - "【未検証】強風日は安定板を使用。安定板使用時はインが有利になるが2-3着は荒れる（R1連動）"

cautions:
  - "【要効果検証】1コース1着率は24場中21位。イン有利が弱い場として扱う"
  - "【要効果検証】2・3コースを1着候補として明確に評価する（16.0% / 14.3%）"
  - "【要効果検証】外枠を軽視しない（4〜6コース合計20.4%・全国6位）"
  - "【未検証】風速・風向を確認する。安定板使用の有無も直前情報で確認してから買い目を組む"

recommended_strategy:
  - "【要効果検証】1コース固定は避け、複数の軸候補を用意する。実測50.3%が支持しない"
  - "【要効果検証】2・3コースを1着候補として組み込む"
  - "【要効果検証】6コースの1着も完全には切らない（2.5%・全国5位）"
  - "【未検証】安定板使用時は1コース軸にしつつ2-3着を4〜5艇に広げる（R1適用）"
