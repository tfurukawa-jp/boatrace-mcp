# 浜名湖競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 6
venue_name: 浜名湖
water_type: brackish         # 汽水（浜名湖。海とつながっている）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 東海（静岡県）

characteristics:
  - "1コース1着率 56.2%（24場中12位）。24場平均55.2%を1.0ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 19.3%（24場中9位）"
  - "2コース1着率 11.9%（24場中21位）と低く、イン以外では3コース13.5%が上"
  - "夏季だけイン有利が大きく落ちる（春55.2 / 夏48.2 / 秋55.5 / 冬55.3%）。夏は8ポイント低い"
  - "【未検証】汽水で、潮の干満の影響が緩やかにある"
  - "【未検証】1800mと距離が長く、コース取りとペース配分が重要になる"
  - "【未検証】水面は比較的穏やかで荒れにくい"
  - "【未検証】海風の影響が出る日があるが、全体的に風の影響は中程度"

cautions:
  - "【要効果検証】「全国平均程度」ではなく、実測はほぼ平均どおり（12位・平均+1.0pt）"
  - "【要効果検証】夏季はイン有利が48.2%まで落ちる。同じ会場として扱わず季節別データを確認する"
  - "【要効果検証】2コースを2着の第一候補と決めつけない（11.9%・24場中21位）。3コース13.5%の方が上"
  - "【未検証】1800mのため展示タイムの解釈に注意。伸びが出る艇が有利になりやすい"

recommended_strategy:
  - "【要効果検証】1コース軸の標準的な組み立て。実測56.2%は平均水準"
  - "【要効果検証】2着候補は3コース（13.5%）と2コース（11.9%）を並べて評価する"
  - "【要効果検証】夏季（6〜8月）はイン信頼度を下げ、2-3着を広めに取る"
  - "【未検証】距離が長いためモーターの伸び足（展示タイムの良さ）を重視する"
