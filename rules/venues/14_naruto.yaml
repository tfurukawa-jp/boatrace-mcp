# 鳴門競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 14
venue_name: 鳴門
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 四国（徳島県）

characteristics:
  - "鳴門海峡に近い海水コース"
  - "1コース1着率 53.9%（24場中18位）。24場平均55.2%を1.3ポイント下回る"
  - "3コース1着率 14.5%（24場中7位）・2コース1着率 14.0%（24場中11位）。中枠が拮抗して強い"
  - "外枠（4〜6コース）の1着率合計 18.8%（24場中10位）。ほぼ全国中位"
  - "直近3ヶ月53.9%に対し、季節別はいずれも47〜49%（春47.2 / 夏48.4 / 秋48.8 / 冬48.6%）"
  - "【未検証】潮の干満の影響が出やすく、満潮時は水面が落ち着き干潮時は流れが出やすい"
  - "【未検証】1800mと距離が長く、伸び足のある艇が有利"
  - "【未検証】海風が強い日は水面が荒れやすく、外枠が台頭しやすくなる"

cautions:
  - "【要効果検証】1コース1着率は平均をやや下回る（18位）。イン有利を強く見積もらない"
  - "【要効果検証】2・3コースが拮抗して強い。どちらか一方だけを2着候補に固定しない"
  - "【要効果検証】直近3ヶ月と季節別データで5ポイント前後の差がある。数値を1つに決めつけず幅を持って見る"
  - "【未検証】潮位の状況を把握してから予想を組み立てる"

recommended_strategy:
  - "【要効果検証】1コース軸は可能だが単独固定にはしない。実測53.9%は平均をやや下回る"
  - "【要効果検証】2・3コースをともに1着候補として評価する（14.0% / 14.5%）"
  - "【要効果検証】外枠は3着付け中心。1着付けは中位水準（18.8%）を踏まえて限定的に"
  - "【未検証】1800mのため展示タイムで伸び足の良い艇を優先評価する"
