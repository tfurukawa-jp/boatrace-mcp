# 戸田競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 2
venue_name: 戸田
water_type: freshwater       # 淡水（荒川旧流路）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（埼玉県）

characteristics:
  - "全国最狭水面（幅約80m）"
  - "1コース1着率 38.7%（24場中24位・全国最低）。24場平均55.2%を16.5ポイント下回る"
  - "外枠（4〜6コース）の1着率合計 26.5%（24場中1位）。全国で最も外枠が1着に来る場"
  - "2コース1着率 17.7%（2位）・3コース1着率 18.0%（2位）。内寄りの2・3コースも全国屈指に高い"
  - "1着が最も分散する場。1〜4コースの1着率が 38.7 / 17.7 / 18.0 / 15.8% とほぼ平坦に並ぶ"
  - "【未検証】スタートのわずかなタイミング差が勝敗に直結する。展示STの精度が重要"
  - "【未検証】差しが決まると高配当になりやすい（市場が差しを軽視するため）"

cautions:
  - "【要効果検証】「狭い水面だからコース通りに決まる」という前提を持ち込まない。実測は逆で、全国で最もインが弱く外枠が強い場である"
  - "【要効果検証】1コースを軸に据える前に、実測38.7%（全国最低）であることを踏まえて信頼度を下げる"
  - "【要効果検証】外枠1着付けを機械的に切らない。4コース1着率15.8%で、1コースとの差は23ポイントしかない"
  - "【要効果検証】他場の感覚をそのまま持ち込むとイン過信の方向に大きくずれる。24場で最も例外的な場として扱う"

recommended_strategy:
  - "【要効果検証】1コース1着固定は避け、複数の軸候補を用意する。1コース単独軸は実測が支持しない"
  - "【要効果検証】2・3コースを1着候補として明確に評価する（17.7% / 18.0%、ともに全国2位）"
  - "【要効果検証】4コースも1着候補から外さない（15.8%）。5・6コースは1着率 7.8% / 2.9% と下がるため3着付け中心"
  - "【要効果検証】1着が分散するため点数を絞りすぎると取りこぼす。R2の「2着を絞り3着を流す」を基本にしつつ、1着候補は複数持つ"
