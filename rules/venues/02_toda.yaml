# 戸田競艇場ルール
venue_id: 2
venue_name: 戸田
water_type: freshwater       # 淡水（荒川旧流路）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（埼玉県）

characteristics:
  - "全国最狭水面（幅約80m）。アウト艇がまくりを打てるスペースが物理的に狭い"
  - "狭さゆえコース通りに決まりやすく、1コース1着率は全国平均より高め（55〜57%）"
  - "外枠からのまくりが成立しにくい。差しも物理的スペースが少ない"
  - "逆に差しが決まると高配当になりやすい（市場が差しを軽視するため）"
  - "スタートのわずかなタイミング差が勝敗に直結する。展示STの精度が重要"

cautions:
  - "4〜6コースの1着は全国平均より低い確率。外枠1着付けは原則切り"
  - "展示STで大きく出遅れた1コース艇は信頼度を下げる"
  - "荒れても外枠よりも内枠有利が続きやすい。中穴を取りに行くなら2・3コースの差しを狙う"

recommended_strategy:
  - "1コース軸の本命〜中本命ライン。2-3着は2・3コース中心に絞り込む"
  - "展示ST最上位が1コースなら本命ボックスを絞って買う"
  - "差し狙いは2コースを優先。外からの差しより内からの差しを評価する"
