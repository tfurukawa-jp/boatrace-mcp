# 大村競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 24
venue_name: 大村
water_type: seawater         # 海水（大村湾）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 九州（長崎県）

characteristics:
  - "大村湾は四方を陸に囲まれた閉鎖的な内湾"
  - "1コース1着率 57.6%（24場中8位）。24場平均55.2%を2.4ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 19.3%（24場中8位）。外枠の1着は全国の中位水準"
  - "イン有利ではあるが全国最高ではない。上位は徳山63.9%・下関62.2%・尼崎61.5%・常滑60.1%"
  - "【未検証】波がほとんど立たない鏡面水面で、スタートが決まりやすい"
  - "【未検証】ナイター帯はイン有利が強まる傾向"

cautions:
  - "【要効果検証】「全国最高クラス」「全国で最もインが強い」として扱わない。実測は8位で、上位4場とは3〜6ポイントの差がある"
  - "【要効果検証】外枠の1着を「全国最低クラス」として切らない。4〜6コース合計19.3%は24場中8位で、むしろ多い部類"
  - "【要効果検証】1コース本命のオッズが低くなりやすい点は変わらない。トリガミ回避ライン（R7）の確認は必要"
  - "【要効果検証】「荒れない場」という前提で買い目を絞りすぎない。外枠1着の頻度は中位水準である"

recommended_strategy:
  - "【要効果検証】1コース軸を基本とするが、1点集中は避ける。実測57.6%は「大原則」と言える水準ではない"
  - "【要効果検証】2着を絞り3着を流す（R2）を素直に適用する"
  - "【要効果検証】外枠は3着付けで残す。19.3%（8位）の1着率を踏まえ、機械的な切りはしない"
  - "【要効果検証】展示ST最上位がアウト（4〜6コース）の場合は1コース切りを検討する"
