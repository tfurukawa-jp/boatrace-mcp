# 大村競艇場ルール
venue_id: 24
venue_name: 大村
water_type: seawater         # 海水（大村湾）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 九州（長崎県）

characteristics:
  - "大村湾は四方を陸に囲まれた閉鎖的な内湾。波がほとんど立たず全国最高峰の鏡面水面"
  - "1コース1着率が全国最高クラス（63〜65%）。全国で最もインが強い場"
  - "穏やかすぎる水面でスタートが決まりやすく、コース通りの決着になりやすい"
  - "ナイター開催あり。夜間帯はさらにイン有利が強まる傾向"
  - "外枠からのまくり・差しが成立しにくい。外枠は3着争いに終わりやすい"
  - "荒れることが全国で最も少ない場の一つ。大穴はほぼ期待できない"

cautions:
  - "1コース本命のオッズが全国で最も低くなりやすい。トリガミ回避ライン（R7）が最重要"
  - "外枠の1着を過度に期待しない。4〜6コースの1着率は全国最低クラス"
  - "荒れ狙いの大穴買いは最も不向きな場。期待値が出ない"

recommended_strategy:
  - "1コース1着固定が大原則。2-3着を2〜4艇に絞ってトリガミ回避ラインを確保"
  - "展示ST最上位が1コースなら買い目を最小限に絞って1点あたりの賭け金を増やす"
  - "住之江・丸亀と同様、展示ST最上位がアウト（4〜6コース）の場合のみ1コース切りを検討"
  - "ナイター帯は特に1コース信頼度が高い。トリガミ回避さえできれば1点集中も選択肢"
