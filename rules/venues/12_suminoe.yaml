# 住之江競艇場ルール
venue_id: 12
venue_name: 住之江
water_type: freshwater       # 淡水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり（トワイライト）
region: 大阪

characteristics:
  - "淡水コース。波高は常に1cm前後の鏡面状態が標準"
  - "春（3〜5月）の1コース1着率64.6%。全国屈指のイン有利場"
  - "ナイター帯（トワイライト）はモーター出力がUPし、イン勝率がさらに上昇する傾向"
  - "一般戦では1コースにB1選手が入ることが約半数。B1でも強引に押し切ることが多い"

cautions:
  - "1コース軸の本命買いはオッズが低くトリガミになりやすい。R7と合わせてトリガミ回避ラインを必ず確認"
  - "B1が1コースの場合でも、当地実績と展示タイムで評価を下げすぎない（過去データR12）"

recommended_strategy:
  - "1コース1着固定で2〜3着を3〜4艇に広げる買い方が基本"
  - "展示ST最上位がアウトコース（4〜6）の場合のみ、1コース切りを検討する"
