# 住之江競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 春季の数値は季節別データ（集計期間 2026-03-01〜05-31）に基づく
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 12
venue_name: 住之江
water_type: freshwater       # 淡水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり（トワイライト）
region: 大阪

characteristics:
  - "淡水コース"
  - "1コース1着率 56.2%（24場中13位）。24場平均55.2%を1.0ポイント上回る"
  - "季節差が大きい。春61.8%（春季4位）・冬62.5% に対し、夏52.7%（春比 -9.1ポイント）"
  - "「春はイン有利が強まる」という傾向は実測で裏付けられる（通年13位 → 春季4位）"
  - "外枠（4〜6コース）の1着率合計 16.0%（24場中21位）。外枠の1着は少ない部類"
  - "2コース1着率 15.2%（24場中6位）。イン以外では2コースが中心"
  - "【未検証】波高は常に1cm前後の鏡面状態が標準"
  - "【未検証】ナイター帯（トワイライト）はモーター出力がUPし、イン勝率がさらに上昇する傾向"
  - "【未検証】一般戦では1コースにB1選手が入ることが約半数。B1でも強引に押し切ることが多い"

cautions:
  - "【要効果検証】通年では「全国屈指のイン有利場」ではない（13位）。春・冬に限れば上位に入る"
  - "【要効果検証】季節を無視して春の数値（61.8%）を通年に適用しない。夏は52.7%まで下がる"
  - "【要効果検証】1コース本命はオッズが低くトリガミになりやすい。R7でトリガミ回避ラインを必ず確認する"
  - "【未検証】B1が1コースの場合でも、当地実績と展示タイムで評価を下げすぎない（R12）"

recommended_strategy:
  - "【要効果検証】春・冬は1コース1着固定を基本とする（61.8% / 62.5%）"
  - "【要効果検証】夏は1コース信頼度を下げる（52.7%）。2-3着を広めに取り、複数の軸候補を検討する"
  - "【要効果検証】2着は2コース（15.2%・全国6位）を軸に絞り、3着を流す（R2）"
  - "【要効果検証】展示ST最上位がアウト（4〜6コース）の場合のみ1コース切りを検討する"
