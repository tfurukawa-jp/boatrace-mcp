# 宮島競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 17
venue_name: 宮島
water_type: seawater         # 海水（瀬戸内海）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # トワイライト開催あり
region: 中国（広島県）

characteristics:
  - "瀬戸内海に面した海水コース"
  - "1コース1着率 57.5%（24場中9位）。24場平均55.2%を2.3ポイント上回る"
  - "3コース1着率 11.5%（24場中20位）と低い。イン以外では2コース13.2%が中心"
  - "外枠（4〜6コース）の1着率合計 18.3%（24場中12位）。ほぼ全国中位"
  - "季節差は小さい（春58.1 / 夏58.5 / 秋55.6 / 冬57.9%）"
  - "【未検証】潮の干満の影響が比較的出やすく、満潮・干潮で水面の流れが変わる"
  - "【未検証】1800mと距離が長く、伸び足重視のコース"
  - "【未検証】トワイライト開催あり。ナイター帯は水面が安定しやすい"

cautions:
  - "【要効果検証】「全国平均程度」ではない。実測は平均を上回る（9位）"
  - "【要効果検証】3コースを1着候補として重く見ない（11.5%・24場中20位）"
  - "【未検証】干潮時は流れが出やすく外枠が台頭しやすい。ただし外枠1着は中位水準（18.3%）"
  - "【未検証】トワイライト帯はトリガミ確認（R7）を行う"

recommended_strategy:
  - "【要効果検証】1コース軸の本命中心。実測57.5%はイン有利が平均より強い"
  - "【要効果検証】2着は2コース（13.2%）を軸に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。1着付けは中位水準を踏まえて限定的に"
  - "【未検証】1800mのため展示タイムで伸び足の良い艇を優先評価する"
