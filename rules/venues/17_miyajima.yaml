# 宮島競艇場ルール
venue_id: 17
venue_name: 宮島
water_type: seawater         # 海水（瀬戸内海）
course_length: 1800
stable_board_used: false
night_race: true             # トワイライト開催あり
region: 中国（広島県）

characteristics:
  - "瀬戸内海に面した海水コース。潮の干満の影響が比較的出やすい"
  - "1800mと距離が長い。伸び足重視のコース"
  - "1コース1着率は全国平均程度（51〜53%）"
  - "トワイライト（夕方〜夜間）開催あり。ナイター帯は水面が安定しやすい"
  - "満潮・干潮のタイミングで水面の流れが変わり、ターンの難易度が変化する"

cautions:
  - "潮位の確認が重要。干潮時は流れが出やすく外枠が台頭しやすくなる"
  - "1800mのため展示タイムで伸び足の良い艇を優先評価する"
  - "トワイライト帯はトリガミ確認（R7）を忘れずに"

recommended_strategy:
  - "満潮・穏やか日：1コース軸で展示タイム上位を2-3着に組み合わせる"
  - "干潮・強風日：外枠（3〜4コース）の台頭を想定し、1コース信頼度を下げる"
  - "トワイライト帯：1コース固定で2-3着を3〜4艇に広げる基本戦略を適用"
