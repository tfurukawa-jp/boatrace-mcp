# びわこ競艇場ルール
venue_id: 11
venue_name: びわこ
water_type: freshwater       # 淡水（琵琶湖）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関西（滋賀県）

characteristics:
  - "琵琶湖の湖上コース。比叡おろし（北風）が強く吹くことが多い"
  - "1800mと距離が長い。伸び足のある艇が有利になりやすい"
  - "1コース1着率は全国平均より低め（48〜50%）。風次第で大きく変わる"
  - "強風時は安定板を使用。安定板使用時はイン有利に傾くが2-3着は荒れる（R1連動）"
  - "湖面が広いため、横風・向風の影響が大きく出やすい"

cautions:
  - "比叡おろしの風速・風向を必ず確認。無風と強風で別の場くらい変わる"
  - "1800mのため展示タイムの伸びを重視。ターン技術より直線速度が重要になりやすい"
  - "安定板使用の有無を直前情報で確認してから買い目を組む"

recommended_strategy:
  - "強風（向風6m超）＋安定板なし：1コース切りを積極検討。外枠まくりを軸に"
  - "安定板使用時：1コース軸＋2-3着を広げる（R1適用）"
  - "展示タイムが突出している艇を必ず軸候補に入れる（1800mは伸び足が直結する）"
  - "穏やかな日でも1コース1着率は高くない。2-3着を広め（4〜5艇）に取るのが基本"
