# びわこ競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 11
venue_name: びわこ
water_type: freshwater       # 淡水（琵琶湖）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関西（滋賀県）

characteristics:
  - "琵琶湖の湖上コース"
  - "1コース1着率 55.2%（24場中15位）。24場平均55.2%とちょうど同じ"
  - "3コース1着率 15.4%（24場中5位）。イン以外では3コースが最も強い"
  - "外枠（4〜6コース）の1着率合計 16.0%（24場中20位）。外枠の1着は少ない部類"
  - "季節差は中程度（春52.5 / 夏51.0 / 秋54.1 / 冬54.3%）"
  - "【未検証】比叡おろし（北風）が強く吹くことが多い"
  - "【未検証】1800mと距離が長く、伸び足のある艇が有利になりやすい"
  - "【未検証】湖面が広いため横風・向風の影響が大きく出やすい"
  - "【未検証】強風時は安定板を使用。安定板使用時はイン有利に傾くが2-3着は荒れる（R1連動）"

cautions:
  - "【要効果検証】「全国平均より低め」ではない。実測は24場平均とちょうど同じ（15位）"
  - "【要効果検証】外枠の1着は少ない部類（16.0%・20位）。「2-3着を広めに取るのが基本」という旧方針は実測が支持しない"
  - "【要効果検証】3コースは1着率15.4%（全国5位）と高い。2着専用にせず1着候補にも入れる"
  - "【未検証】比叡おろしの風速・風向を確認する。安定板使用の有無も直前情報で確認する"

recommended_strategy:
  - "【要効果検証】1コース軸の標準的な組み立て。実測55.2%は平均どおり"
  - "【要効果検証】3コースを1着候補としても評価する（15.4%・全国5位）"
  - "【要効果検証】2着を絞り3着を流す（R2）を素直に適用する。外枠1着が少ないため広げすぎない"
  - "【未検証】1800mのため展示タイムの伸びを重視する。突出している艇を軸候補に入れる"
