# 芦屋競艇場ルール
venue_id: 21
venue_name: 芦屋
water_type: seawater         # 海水（遠賀川河口付近）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 九州（福岡県）

characteristics:
  - "遠賀川河口付近に位置する海水コース。水面は比較的穏やか"
  - "1コース1着率は全国平均程度（51〜53%）"
  - "ナイター開催あり。夜間帯は水面が安定しやすくイン有利が強まる傾向"
  - "風の影響は中程度。極端に荒れることは少ない"

cautions:
  - "ナイター帯はトリガミ確認（R7）を忘れずに。1コース本命オッズが低くなりやすい"
  - "河口に近いため、増水・潮位変化が稀に水面に影響することがある"

recommended_strategy:
  - "1コース軸の本命〜中本命。展示タイム・展示ST上位を2-3着に組み合わせる"
  - "ナイター帯：1コース固定で2-3着を3〜4艇に広げる基本戦略を適用"
  - "R3（展示ST×当地3連率のクロス）を基本として適用"
