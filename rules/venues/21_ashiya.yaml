# 芦屋競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 21
venue_name: 芦屋
water_type: seawater         # 海水（遠賀川河口付近）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 九州（福岡県）

characteristics:
  - "遠賀川河口付近に位置する海水コース"
  - "1コース1着率 58.8%（24場中7位）。24場平均55.2%を3.6ポイント上回る"
  - "2コース1着率 10.2%（24場中24位・全国最低）。イン以外では3コース13.5%が上"
  - "外枠（4〜6コース）の1着率合計 18.5%（24場中11位）。ほぼ全国中位"
  - "季節差が大きい（春61.8 / 夏54.4 / 秋60.1 / 冬63.7%）。夏は冬より9.3ポイント低い"
  - "【未検証】水面は比較的穏やかで、風の影響は中程度"
  - "【未検証】ナイター開催あり。夜間帯は水面が安定しやすくイン有利が強まる傾向"
  - "【未検証】河口に近いため、増水・潮位変化が稀に水面に影響することがある"

cautions:
  - "【要効果検証】「全国平均程度」ではない。実測はイン有利が24場中7位と強い"
  - "【要効果検証】2コースを2着の第一候補と決めつけない（10.2%・全国最低）。3コース13.5%の方が上"
  - "【要効果検証】夏季は54.4%まで下がる。季節別データを確認する"
  - "【未検証】ナイター帯は1コース本命オッズが低くなりやすい。R7を適用する"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測58.8%は全国7位"
  - "【要効果検証】2着候補は3コース（13.5%）を優先し、2コース（10.2%）と並べて評価する"
  - "【要効果検証】外枠は3着付け中心。1着付けは中位水準（18.5%）を踏まえて限定的に"
  - "【要効果検証】夏季はイン信頼度を下げ、2-3着を広めに取る"
