# 常滑競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 8
venue_name: 常滑
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: true             # ナイター開催あり
region: 東海（愛知県）

characteristics:
  - "伊勢湾に面した内海に位置する"
  - "1コース1着率 60.1%（24場中4位）。24場平均55.2%を4.9ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 17.1%（24場中17位）。外枠の1着は少ない部類"
  - "3コース1着率 10.2%（24場中23位）と低い。イン以外では2コース13.0%が中心"
  - "季節差は小さくイン有利が通年で安定（春55.7 / 夏60.4 / 秋57.9 / 冬58.4%）"
  - "【未検証】水面は穏やかで荒れにくい"
  - "【未検証】ナイター開催あり。夜間帯は風が落ち着き水面がさらに安定しやすい"
  - "【未検証】海水だが潮の干満の影響は小さい"

cautions:
  - "【要効果検証】「全国平均程度」として扱わない。実測はイン有利が24場中4位と強い"
  - "【要効果検証】3コースを1着候補として重く見ない（10.2%・24場中23位）"
  - "【要効果検証】外枠の1着は少ない部類（17.1%・17位）。ただし徳山13.3%ほど極端ではない"
  - "【未検証】ナイター帯は1コース信頼度が上がり低オッズになりやすい。R7の確認を必須とする"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測60.1%は全国4位"
  - "【要効果検証】2着は2コース（13.0%）を軸に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。1着付けは実測が支持しない"
  - "【要効果検証】低オッズになりやすいためトリガミ回避ライン（R7）を必ず確認する"
