# 常滑競艇場ルール
venue_id: 8
venue_name: 常滑
water_type: seawater         # 海水
course_length: 1200
stable_board_used: false
night_race: true             # ナイター開催あり
region: 東海（愛知県）

characteristics:
  - "伊勢湾に面した内海。水面は穏やかで荒れにくい"
  - "1コース1着率は全国平均程度（51〜53%）"
  - "ナイター開催あり。夜間帯は風が落ち着き水面がさらに安定しやすい"
  - "全国屈指の設備規模を誇るナイター場。スタンドの照明が整備されている"

cautions:
  - "ナイター帯は特に1コース信頼度が上がる。低オッズになりやすいのでトリガミ確認必須（R7）"
  - "海水だが潮の干満の影響は小さい。水面状況の変化が少ない分、データ通りに読みやすい"

recommended_strategy:
  - "1コース軸の本命〜中本命。展示タイム・展示STの順位通りに組み立てやすい場"
  - "ナイター帯は1コース固定で2〜3着を3〜4艇に広げるのが基本"
  - "荒れ狙いよりも堅実な買い方が合う場"
