# 桐生競艇場ルール
venue_id: 1
venue_name: 桐生
water_type: freshwater       # 淡水（渡良瀬川の人工池）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（群馬県）

characteristics:
  - "全国で最も標高が高い競艇場（約150m）。空気が薄くモーター出力が全国平均より落ちる"
  - "赤城おろし（北風）が強く吹く日が多い。向風になるとインが苦しくなる"
  - "1コース1着率は全国平均より低め（50%前後）。インが弱い部類"
  - "高標高×強風の組み合わせで荒れやすく、穴が出やすい場"
  - "夏場はモーター出力の低下がさらに顕著になる（気温上昇で空気密度がさらに低下）"

cautions:
  - "風速・風向を必ず確認。赤城おろし（北風）が強い日はイン信頼度を大幅に下げる"
  - "モーター2連率の絶対値を他場と同じ基準で見ない。全体的に数値が下がりがちなため相対比較が重要"
  - "高標高のため展示タイムも全体的に遅め。他場との比較より出走メンバー内での相対順位を重視する"

recommended_strategy:
  - "強風（向風6m超）の日：1コース切りを積極検討。3〜4コースのまくりを軸に"
  - "微風・追風の日：1コース軸でも可。2-3着は機力上位を中心に3〜4艇"
  - "穴狙いが機能しやすい場。R14（展示好調の中穴）を積極適用する"
