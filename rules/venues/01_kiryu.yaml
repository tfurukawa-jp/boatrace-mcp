# 桐生競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 1
venue_name: 桐生
water_type: freshwater       # 淡水（渡良瀬川の人工池）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 関東（群馬県）

characteristics:
  - "全国で最も標高が高い競艇場（約150m）"
  - "1コース1着率 52.2%（24場中20位）。24場平均55.2%を3.0ポイント下回る"
  - "外枠（4〜6コース）の1着率合計 21.3%（24場中3位）。外枠が1着に来る頻度は高い部類"
  - "6コース1着率 3.1%（24場中2位）。6コースの1着が全国で2番目に多い"
  - "季節差が小さくイン有利が通年で弱い（春49.9 / 夏48.1 / 秋48.5 / 冬50.3%）"
  - "【未検証】空気が薄くモーター出力が全国平均より落ちる"
  - "【未検証】赤城おろし（北風）が強く吹く日が多く、向風になるとインが苦しくなる"
  - "【未検証】夏場はモーター出力の低下がさらに顕著になる"

cautions:
  - "【未検証】風速・風向を必ず確認。赤城おろし（北風）が強い日はイン信頼度を下げる"
  - "【未検証】モーター2連率の絶対値を他場と同じ基準で見ない。出走メンバー内での相対比較を重視する"
  - "【未検証】高標高のため展示タイムも全体的に遅め。他場との比較より相対順位を見る"
  - "【要効果検証】1コース1着率は平均を下回るが、江戸川45.4%・平和島44.7%・戸田38.7%ほど低くはない。下げ幅を取りすぎない"

recommended_strategy:
  - "【要効果検証】1コース軸は可能だが単独固定にはしない。実測52.2%は平均をやや下回る水準"
  - "【要効果検証】外枠を1着候補から機械的に外さない（4〜6コース合計21.3%・全国3位）"
  - "【要効果検証】6コースは1着率3.1%（全国2位）。他場より1着の目を残す価値がある"
  - "【未検証】強風（向風6m超）の日は1コース切りを検討し、3〜4コースのまくりを軸候補にする"
