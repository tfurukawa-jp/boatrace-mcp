# 徳山競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 18
venue_name: 徳山
water_type: seawater         # 海水
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 中国（山口県）

characteristics:
  - "徳山湾の内湾に位置する"
  - "1コース1着率 63.9%（24場中1位・全国最高）。24場平均55.2%を8.7ポイント上回る"
  - "外枠（4〜6コース）の1着率合計 13.3%（24場中23位）。外枠が1着に来ることは全国で2番目に少ない"
  - "6コース1着率 0.7%（24場中24位・全国最低）。6コースの1着はほぼ期待できない"
  - "3コース1着率 9.6%（24場中24位・全国最低）。イン以外では2コース13.6%が最も高い"
  - "【未検証】水面が穏やかで、風の影響は中程度"

cautions:
  - "【要効果検証】「標準的な場」として扱わない。実測では24場で最もインが強い場である"
  - "【要効果検証】1コース本命のオッズが低くなりやすい。トリガミ回避ライン（R7）の確認が特に重要"
  - "【要効果検証】外枠の1着を期待しない。4〜6コース合計で13.3%しかない"
  - "【要効果検証】3コースを1着候補として扱わない（9.6%・全国最低）。2コース13.6%との差が大きい"

recommended_strategy:
  - "【要効果検証】1コース1着固定を基本とする。実測63.9%は全国で最も高い"
  - "【要効果検証】2着は2コース（13.6%）を軸に、3コース以下を絡めて絞る。3着を流してトリガミ回避ラインを確保する"
  - "【要効果検証】外枠は3着付け中心。1着付けは実測が支持しない"
  - "【要効果検証】点数を絞り1点あたりの賭け金を増やす方針が合う。ただし低オッズになるためR7の確認を欠かさない"
