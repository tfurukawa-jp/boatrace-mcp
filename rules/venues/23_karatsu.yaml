# 唐津競艇場ルール
#
# 1コース1着率等の数値は data/course_rates.yaml の実測値に基づく
# 集計期間: 2026-05-01〜07-31 / 取得日: 2026-08-03
# 元データを更新した場合は、この記述も更新すること
#
# 【未検証】と付いた項目は、実測で否定も裏付けもできていない記述。
# 過去に蓄積した知見として残しているが、検証の対象。

venue_id: 23
venue_name: 唐津
water_type: seawater         # 海水（唐津湾）
course_length: 1800          # 標準1800m（荒天時・時間短縮時のみ1200mに変更）
stable_board_used: conditional  # 強風時はどの会場でも使用あり（直前情報で要確認）
night_race: false
region: 九州（佐賀県）

characteristics:
  - "玄界灘に面した唐津湾の海水コース"
  - "1コース1着率 57.4%（24場中10位）。24場平均55.2%を2.2ポイント上回る"
  - "2コース1着率 14.5%（24場中7位）。イン以外では2コースが中心"
  - "外枠（4〜6コース）の1着率合計 17.2%（24場中16位）。外枠の1着は少ない部類"
  - "季節差は中程度（春57.9 / 夏54.0 / 秋53.3 / 冬57.3%）"
  - "【未検証】外洋に近く風が強い日が多い"
  - "【未検証】玄界灘からの強風が吹く日は水面が荒れ、外枠が台頭しやすくなる"
  - "【未検証】1800mと距離が長く、伸び足のある艇が有利になりやすい"

cautions:
  - "【要効果検証】「全国平均程度」ではない。実測は平均を上回る（10位）"
  - "【要効果検証】強風を理由にイン信頼度を「大幅に」下げない。基準は57.4%（10位）であり、外枠1着も少ない部類（16位）"
  - "【未検証】玄界灘の風に注意する。向風6m超の日は条件別ルールを適用する"
  - "【未検証】1800mのため展示タイムで伸び足の良い艇を優先評価する"

recommended_strategy:
  - "【要効果検証】1コース軸の本命中心。実測57.4%はイン有利が平均より強い"
  - "【要効果検証】2着は2コース（14.5%）を軸に絞り、3着を流す（R2）"
  - "【要効果検証】外枠は3着付け中心。強風日でも1着付けへの格上げは慎重に行う"
  - "【未検証】強風日は3〜4コースを2着候補に格上げして対応する"
